name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check attendance tests wsgi.py --select E,F,W,B,I --line-length 130
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: instance/models
          key: face-models-v1
      - run: FLASK_APP=wsgi flask download-models
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t face-attendance .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 -e SECRET_KEY=ci --name app face-attendance
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/login | grep -q "Sign in"
