{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block title %}{{ 'Edit' if st.id else 'Add' }} student{% endblock %}
{% block heading %}{{ 'Edit ' ~ st.name if st.id else 'Add student' }}{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:760px">{{ csrf() }}
  <div class="form-grid">
    <label class="f">Roll number<input name="roll_no" value="{{ st.roll_no or '' }}" required maxlength="20" placeholder="23BCP101"></label>
    <label class="f">Full name<input name="name" value="{{ st.name or '' }}" required maxlength="120"></label>
    <label class="f">Email <small>optional</small><input type="email" name="email" value="{{ st.email or '' }}"></label>
    <label class="f">Department<select name="department_id"><option value="">–</option>
      {% for d in depts %}<option value="{{ d.id }}" {{ 'selected' if st.department_id == d.id }}>{{ d.code }} · {{ d.name }}</option>{% endfor %}</select></label>
    <label class="f">Year<input type="number" name="year" min="1" max="6" value="{{ st.year or 1 }}"></label>
    <label class="f">Division<input name="division" value="{{ st.division or '' }}" maxlength="10" placeholder="D1"></label>
  </div>
  <div style="margin-top:18px;display:flex;gap:8px"><button class="btn primary">{{ 'Save changes' if st.id else 'Add student' }}</button>
  <a class="btn ghost" href="{{ url_for('main.student_detail', sid=st.id) if st.id else url_for('main.students') }}">Cancel</a></div>
</form>
{% endblock %}
