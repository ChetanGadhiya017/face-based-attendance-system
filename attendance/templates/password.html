{% extends "base.html" %}{% from "_macros.html" import csrf with context %}
{% block title %}Change password{% endblock %}{% block heading %}Change password{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:460px;display:flex;flex-direction:column;gap:14px">{{ csrf() }}
  <label class="f">Current password<input type="password" name="current" required autocomplete="current-password"></label>
  <label class="f">New password <small>at least 8 characters</small><input type="password" name="new" minlength="8" required autocomplete="new-password"></label>
  <label class="f">Confirm new password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
  <div><button class="btn primary">Update password</button></div>
</form>
{% endblock %}
